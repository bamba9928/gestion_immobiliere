version: 2
updates:
  # Correctifs de sécurité regroupés en une seule PR : des PR séparées sur
  # requirements.txt entrent en conflit et déclenchent un déploiement chacune.
  # open-pull-requests-limit: 0 coupe les mises à jour de version ordinaires
  # sans toucher aux mises à jour de sécurité.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      securite:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
